[agent]
## Default data collection interval for all inputs
interval = "3s"
collection_jitter = "2s"

flush_interval = "5s"
flush_jitter = "2s"

omit_hostname = true

[[inputs.mqtt_consumer]]
servers = ["tcp://mqtt.docker.local:1883"]
topics = ["npk/+"]
data_format = "json_v2"
topic_tag = ""
qos = 1

	[[inputs.mqtt_consumer.json_v2]]
		measurement_name = "npk"
 		timestamp_path = "timestamp"
		timestamp_format = "2006-01-02T15:04:05.999-07:00" 

		[[inputs.mqtt_consumer.json_v2.field]]
			path = "nitrogen_mg_kg" # A string with valid GJSON path syntax
			type = "float"
			optional = true

		[[inputs.mqtt_consumer.json_v2.field]]
			path = "phosphorus_mg_kg" # A string with valid GJSON path syntax
			type = "float"
			optional = true

		[[inputs.mqtt_consumer.json_v2.field]]
			path = "potassium_mg_kg" # A string with valid GJSON path syntax
			type = "float"
			optional = true
		
		[[inputs.mqtt_consumer.json_v2.tag]]
			path = "identifier" # A string with valid GJSON path syntax
			type = "string"

