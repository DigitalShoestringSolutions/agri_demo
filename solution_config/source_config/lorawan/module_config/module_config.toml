[mapper]
    topic_pattern = "{gw}/{DeviceID}/{type}"    # only the DeviceID field matters, the rest are wildcard placeholders


[mapping.0185196C]
    type = "llms01"
    identifier = "Leaves"

[mapping.005F3CDD]
    type = "lht65n_vib"
    identifier = "Vibration A"

[mapping.005CFC22]
    type = "sw3l"
    identifier = "Pipe A"

[mapping.005B97BC]
    type = "lse01"
    identifier = "Soil"

[mapping.006110F7]
    type = "rs485_npk"
    identifier = "Soil"

[mapping.00603420]
    type = "s31b"
    identifier = "Zone A"

[mapping.0061A3EB]
    type = "cs01"
    identifier = "Machine A"
    identifier_tag = "machine"
    multi_sample_offset_s = 10
    
[mqtt_in]
    broker = "mqtt.docker.local"
    port = 1883   #common mqtt ports are 1883 and 8883
    topic_prefix = ""

    subscriptions = ["dragino-2e2f5c/#"]

    #reconnection characteristics
    # start: timeout = initial,
    # if timeout < limit then
    #   timeout = timeout*backoff
    # else
    #   timeout = limit
    reconnect.initial = 5 # seconds
    reconnect.backoff = 2 # multiplier
    reconnect.limit = 60 # seconds

[mqtt_out]
    broker = "mqtt.docker.local"
    port = 1883   #common mqtt ports are 1883 and 8883
    topic_prefix = ""

    #reconnection characteristics
    # start: timeout = initial,
    # if timeout < limit then
    #   timeout = timeout*backoff
    # else
    #   timeout = limit
    reconnect.initial = 5 # seconds
    reconnect.backoff = 2 # multiplier
    reconnect.limit = 60 # seconds